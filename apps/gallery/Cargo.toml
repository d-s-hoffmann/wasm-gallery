[package]
name = "gallery"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact version: it must match the wasm-bindgen CLI that generates the glue.
wasm-bindgen = "=0.2.130"

[dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "ImageData",
    "Node",
    "Performance",
    "Window",
]
