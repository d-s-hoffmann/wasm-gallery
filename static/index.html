<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebAssembly Gallery</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0920;
    font-family: system-ui, sans-serif;
    color: #e8e5ff;
  }
  /* The view fills the window. The client sets the canvas's pixel buffer
     size; the browser stretches it to the displayed size. */
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  /* The menu floats above the view, clear of notches and rounded corners.
     It is a <details> element, so the browser opens and closes it; closed,
     only the small button (its <summary>) is left. */
  #menu {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    max-width: calc(100vw - 24px);
  }
  #menu > summary {
    list-style: none; /* hide the default triangle */
    width: 2.5rem;
    height: 2.5rem;
    display: grid;
    place-items: center;
    font-size: 1.25rem;
    cursor: pointer;
    background: rgba(11, 9, 32, 0.75);
    backdrop-filter: blur(6px);
    border: 1px solid #34266f;
    border-radius: 10px;
  }
  #menu > summary::-webkit-details-marker { display: none; }
  .panel {
    margin-top: 0.5rem;
    padding: 0.75rem 1rem;
    background: rgba(11, 9, 32, 0.75);
    backdrop-filter: blur(6px);
    border: 1px solid #34266f;
    border-radius: 10px;
  }
  h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: 0.02em; }
  .sub { margin: 0.25rem 0 0; color: #a89fd6; font-size: 0.8rem; }
  #controls { margin-top: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .btn {
    background: #241a52;
    color: #cdc6ff;
    border: 1px solid #4b3a9e;
    border-radius: 8px;
    padding: 0.5rem 1.1rem;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn:hover { background: #34266f; }
  .slider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
  }
  .slider > span:first-child { width: 3.5rem; color: #a89fd6; }
  .slider > input { flex: 1; min-width: 6rem; }
  .slider > span:last-child { width: 3.5rem; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<details id="menu" open>
  <summary aria-label="Menu">☰</summary>
  <nav class="panel">
    <h1>WebAssembly Gallery</h1>
    <p class="sub">Renderer and UI compiled to WebAssembly — no application JavaScript.</p>
    <div id="controls"></div>
    <p id="stats" class="sub"></p>
  </nav>
</details>
<script type="module" src="load.js"></script>
</body>
</html>
